x-app: &app
  image: novaimport:local
  build:
    context: .
  restart: unless-stopped
  environment: &app-environment
    NODE_ENV: production
    DB_TIMEZONE: "${DB_TIMEZONE:--05:00}"
    DB_HOST: ${DB_HOST_CONTAINER:-host.docker.internal}
    DB_PORT: ${DB_PORT:-3306}
    DB_USER: ${DB_USER:?Set DB_USER in .env}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    DB_NAME: ${DB_NAME:-novaimport}
    DB_SSL: ${DB_SSL:-false}
    DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-5}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}

services:
  gateway:
    <<: *app
    command: ["node", "src/server.js"]
    ports: ["127.0.0.1:3000:3000"]
    expose: ["3000"]
    environment:
      <<: *app-environment
      PORT: 3000
      PRODUCTOS_SERVICE_URL: http://productos:3001
      PEDIDOS_SERVICE_URL: http://pedidos:3002
      PQRS_SERVICE_URL: http://pqrs:3003
      GARANTIAS_SERVICE_URL: http://garantias:3004
      AUTH_SERVICE_URL: http://auth:3005
      CLIENTES_SERVICE_URL: http://clientes:3006
    volumes:
      - product-images:/app/public/img:ro
      - uploads:/app/public/uploads:ro
    depends_on:
      productos:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      pqrs:
        condition: service_healthy
      garantias:
        condition: service_healthy
      auth:
        condition: service_healthy
      clientes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  productos:
    <<: *app
    command: ["node", "src/service.js", "productos"]
    expose: ["3001"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3001
    volumes:
      - product-images:/app/public/img
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  pedidos:
    <<: *app
    command: ["node", "src/service.js", "pedidos"]
    expose: ["3002"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  pqrs:
    <<: *app
    command: ["node", "src/service.js", "pqrs"]
    expose: ["3003"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3003
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    volumes:
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  garantias:
    <<: *app
    command: ["node", "src/service.js", "garantias"]
    expose: ["3004"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3004
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    volumes:
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    <<: *app
    command: ["node", "src/service.js", "auth"]
    expose: ["3005"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3005
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  clientes:
    <<: *app
    command: ["node", "src/service.js", "clientes"]
    expose: ["3006"]
    environment:
      <<: *app-environment
      SERVICE_PORT: 3006
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  product-images:
  uploads:
  caddy-data:
  caddy-config:
